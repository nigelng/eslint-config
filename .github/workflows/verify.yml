name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # every yarn invocation reads .yarnrc.yml, so the GitHub Packages token
    # must be set for all steps, not just install
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@nigelng'
      - name: Install Deps
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Check Formatting
        run: yarn format:check
